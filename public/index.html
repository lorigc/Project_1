<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#c62828" />
    <title>Slice — Pizza Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <div class="logo">🍕</div>
          <div>
            <h1>Slice</h1>
            <p class="tagline">Hot pizza, fast.</p>
          </div>
        </div>
        <button id="cartBadge" class="cart-badge" aria-label="Open cart">
          🛒<span id="cartCount" class="count" hidden>0</span>
        </button>
      </header>

      <!-- Menu view -->
      <section id="view-menu" class="view">
        <div class="search-row">
          <input id="q" type="search" placeholder="Search the menu…" autocomplete="off" />
        </div>
        <nav id="categories" class="chips" aria-label="Categories"></nav>
        <div id="menu" class="menu-list"></div>
      </section>

      <!-- Cart view -->
      <section id="view-cart" class="view" hidden>
        <h2>Your Order</h2>
        <div id="cartItems"></div>
        <div id="cartSummary" class="summary" hidden>
          <div class="row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
          <div class="row"><span>Delivery</span><span id="sumDelivery"></span></div>
          <div class="row total"><span>Total</span><span id="sumTotal"></span></div>
          <p id="freeDeliveryHint" class="hint" hidden></p>
        </div>
        <form id="checkoutForm" hidden>
          <h3>Delivery details</h3>
          <input name="name" placeholder="Full name" required autocomplete="name" />
          <input name="phone" placeholder="Phone" type="tel" required autocomplete="tel" />
          <input name="address" placeholder="Street address" required autocomplete="street-address" />
          <input name="notes" placeholder="Delivery notes (optional)" />
          <button type="submit" class="primary" id="placeOrderBtn">Place Order</button>
        </form>
        <div id="orderResult" hidden></div>
      </section>

      <!-- Orders view -->
      <section id="view-orders" class="view" hidden>
        <h2>Past Orders</h2>
        <div id="ordersList"></div>
      </section>

      <!-- Bottom navigation -->
      <nav class="bottom-nav">
        <button data-view="menu" class="active"><span class="icon">🍕</span>Menu</button>
        <button data-view="cart"><span class="icon">🛒</span>Cart</button>
        <button data-view="orders"><span class="icon">📦</span>Orders</button>
      </nav>
    </div>

    <!-- Item customization bottom sheet -->
    <div id="sheetOverlay" class="sheet-overlay" hidden>
      <div id="sheet" class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
